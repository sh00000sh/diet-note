name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  web:
    name: 앱 화면 (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 설정 파일 만들기
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          node -e '
            const c = { SUPABASE_URL: process.env.SUPABASE_URL || "", SUPABASE_ANON_KEY: process.env.SUPABASE_ANON_KEY || "",
                        WORKER_URL: process.env.WORKER_URL || "", VAPID_PUBLIC_KEY: process.env.VAPID_PUBLIC_KEY || "" };
            require("fs").writeFileSync("web/config.js", "window.DIET_CONFIG = " + JSON.stringify(c, null, 2) + ";\n");'
          sed -i "s/const VERSION = \"v1\"/const VERSION = \"${GITHUB_SHA::8}\"/" web/sw.js
      - name: Cloudflare Pages (dietnote.pages.dev)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages project create dietnote --production-branch main || true
          npx --yes wrangler@3 pages deploy web --project-name dietnote --branch main --commit-dirty=true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4

  api:
    name: 서버 (Cloudflare Worker)
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_WORKER == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: worker
      - name: 서버 배포 + 키 넣기
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          NAVER_CLIENT_ID: ${{ vars.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
        run: |
          # 실패하면 이유를 GitHub 화면(요약)에 보이게
          run() {
            out=$("$@" 2>&1); code=$?
            echo "$out"
            if [ $code -ne 0 ]; then echo "::error::$(echo "$out" | grep -v '^[[:space:]]*$' | tail -15 | tr '\n' ' ' | cut -c1-1500)"; exit $code; fi
          }
          run npx wrangler deploy --var "SUPABASE_URL:$SUPABASE_URL" --var "VAPID_PUBLIC_KEY:$VAPID_PUBLIC_KEY" --var "ALLOWED_ORIGIN:$ALLOWED_ORIGIN"
          for k in ANTHROPIC_API_KEY SUPABASE_SERVICE_KEY VAPID_PRIVATE_KEY NAVER_CLIENT_ID NAVER_CLIENT_SECRET; do
            v="${!k}"
            if [ -n "$v" ]; then printf '%s' "$v" | run npx wrangler secret put "$k"; fi
          done
